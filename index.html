<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Menna's Bachelorette Party</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --burgundy:#53181f;
    --burgundy-light:#7a2631;
    --deep-plum:#16070d;
    --night:#090408;
    --red:#b4312f;
    --skin:#e3a27b;
    --black:#050505;
    --soft:#fff4f1;
    --gold:#d5a652;
    --amber:#f2b34c;
}

body{
    min-height:100svh;
    overflow:hidden;
    background:var(--black);
    font-family:Garamond, Georgia, serif;
    color:var(--soft);
}

button{
    font:inherit;
}

.loading-page{
    position:fixed;
    inset:0;
    z-index:30;
    display:grid;
    place-items:center;
    padding:24px 20px 96px;
    overflow:hidden;
    background:var(--night);
    transition:opacity .8s ease, visibility .8s ease;
}

.loading-page::before,
.touch-page::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 70% 34%, rgba(128,42,29,.34), transparent 18%),
        radial-gradient(circle at 18% 68%, rgba(96,10,22,.34), transparent 25%),
        linear-gradient(134deg, rgba(42,4,15,.7), transparent 36%),
        linear-gradient(178deg, #260a10 0%, #15060b 44%, #1d0805 100%);
}

.loading-page::after,
.touch-page::after{
    content:"";
    position:absolute;
    inset:0;
    opacity:.34;
    background:
        repeating-linear-gradient(115deg, transparent 0 22px, rgba(255,255,255,.025) 23px 24px),
        radial-gradient(circle at 25% 25%, rgba(255,255,255,.04), transparent 1px);
    background-size:auto, 42px 42px;
    mix-blend-mode:screen;
}

.loading-page.is-hidden{
    opacity:0;
    visibility:hidden;
}

.loading-content{
    position:relative;
    z-index:1;
    text-align:center;
    color:#f9debd;
    transform:translateY(8vh);
}

.loading-content h1{
    font-family:"Brush Script MT", "Segoe Script", cursive;
    font-size:clamp(4.1rem, 18vw, 7.2rem);
    font-weight:400;
    line-height:.9;
    letter-spacing:0;
    background:linear-gradient(92deg, #ffcf58 0%, #f08a39 44%, #aa3228 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 8px 24px rgba(0,0,0,.42);
}

.loading-content p{
    margin-top:22px;
    font-size:clamp(1.15rem, 4.8vw, 1.75rem);
    font-style:italic;
    letter-spacing:7px;
    color:#f0d2ba;
    text-shadow:0 4px 20px rgba(0,0,0,.5);
}

.loading-dots{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:34px;
}

.loading-dots span{
    width:18px;
    height:18px;
    border-radius:50%;
    animation:pulse 1.2s ease-in-out infinite;
}

.loading-dots span:nth-child(1){
    background:#bd302f;
}

.loading-dots span:nth-child(2){
    background:#d99b2d;
    animation-delay:.16s;
}

.loading-dots span:nth-child(3){
    background:#9d7652;
    animation-delay:.32s;
}

.touch-page{
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    padding:18px 24px 74px;
    background:var(--night);
}

.touch-page .stage-border{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:14px;
    z-index:2;
    background:
        repeating-linear-gradient(90deg, #7b5b48 0 20px, #2a1715 20px 34px, #9f7a5e 34px 48px, #34201a 48px 62px);
}

.stars{
    position:absolute;
    inset:0;
    z-index:1;
    background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.74) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(213,166,82,.8) 0 1.5px, transparent 2px);
    background-position:9% 12%, 85% 8%, 13% 69%;
    background-size:108px 154px, 162px 194px, 180px 220px;
}

.touch-button{
    width:min(440px, 100%);
    border:0;
    background:transparent;
    color:var(--soft);
    cursor:pointer;
    text-align:center;
    position:relative;
    z-index:3;
    padding-top:16px;
}

.spark-layer{
    position:absolute;
    inset:0;
    z-index:4;
    pointer-events:none;
    overflow:hidden;
}

.spark{
    position:absolute;
    left:50%;
    top:18%;
    width:9px;
    height:9px;
    border-radius:2px;
    background:linear-gradient(135deg, #fff2a6, #d6a02f 55%, #8f6419);
    box-shadow:0 0 12px rgba(255,216,106,.42);
    transform:translate(-50%, -50%);
    animation:goldConfetti 1.55s ease-out forwards;
}

.spark::after{
    content:"";
    position:absolute;
    inset:1px;
    border-radius:1px;
    background:rgba(255,255,255,.24);
}

.cartoon{
    --dancer-scale:1;
    width:270px;
    height:500px;
    margin:0 auto 12px;
    position:relative;
    filter:drop-shadow(0 26px 45px rgba(0,0,0,.55));
    transform-origin:center top;
    animation:float 2.8s ease-in-out infinite;
}

.cartoon::before{
    content:"";
    position:absolute;
    width:230px;
    height:410px;
    left:20px;
    top:48px;
    border-radius:52% 48% 46% 54%;
    background:radial-gradient(circle, rgba(226,125,49,.38), transparent 58%);
    filter:blur(6px);
}

.veil{
    position:absolute;
    width:106px;
    height:292px;
    left:138px;
    top:84px;
    border-radius:80px 80px 70px 0;
    background:linear-gradient(88deg, rgba(139,65,43,.42), rgba(210,118,67,.16));
    transform:skewX(-10deg);
}

.hair{
    position:absolute;
    width:110px;
    height:190px;
    left:80px;
    top:38px;
    background:#1a0908;
    border-radius:58px 58px 28px 28px;
    box-shadow:inset 0 -20px 0 rgba(0,0,0,.18);
}

.face{
    position:absolute;
    width:74px;
    height:76px;
    left:98px;
    top:64px;
    background:var(--skin);
    border-radius:48% 48% 45% 45%;
    z-index:4;
}

.neck{
    position:absolute;
    width:30px;
    height:30px;
    left:120px;
    top:132px;
    background:var(--skin);
    z-index:3;
}

.headpiece{
    position:absolute;
    width:88px;
    height:20px;
    left:91px;
    top:60px;
    background:linear-gradient(90deg, transparent 4%, #f0c648 5% 95%, transparent 96%);
    border-radius:50% 50% 0 0;
    z-index:5;
}

.headpiece::before{
    content:"";
    position:absolute;
    width:9px;
    height:12px;
    left:39px;
    top:-8px;
    border-radius:50% 50% 45% 45%;
    background:#c72e2d;
    box-shadow:0 11px 0 #f6d35c;
}

.earring{
    position:absolute;
    width:17px;
    height:17px;
    top:116px;
    border-radius:50%;
    background:#e1bb39;
    z-index:5;
}

.earring.left{
    left:85px;
}

.earring.right{
    right:85px;
}

.eye{
    position:absolute;
    width:9px;
    height:12px;
    top:92px;
    background:#111;
    border-radius:50%;
    z-index:6;
    box-shadow:0 -4px 0 #fff;
}

.eye.left{
    left:112px;
}

.eye.right{
    right:112px;
}

.smile{
    position:absolute;
    width:28px;
    height:13px;
    left:121px;
    top:116px;
    border-bottom:2px solid #9a2d29;
    border-radius:0 0 40px 40px;
    z-index:6;
}

.top{
    position:absolute;
    width:92px;
    height:46px;
    left:89px;
    top:150px;
    background:#b9152e;
    border-radius:18px 18px 8px 8px;
    clip-path:polygon(8% 35%, 35% 8%, 50% 32%, 65% 8%, 92% 35%, 86% 100%, 14% 100%);
    z-index:3;
    box-shadow:0 4px 0 #d9af40;
}

.top::before,
.top::after{
    content:"";
    position:absolute;
    width:26px;
    height:18px;
    top:15px;
    border-radius:50%;
    background:#d91f3c;
    box-shadow:inset 0 -5px 0 rgba(76,5,15,.22);
}

.top::before{
    left:15px;
}

.top::after{
    right:15px;
}

.lower-body{
    position:absolute;
    inset:0;
    z-index:2;
    transform-origin:135px 220px;
    animation:bellyShimmy 1.05s ease-in-out infinite;
}

.waist{
    position:absolute;
    width:44px;
    height:46px;
    left:113px;
    top:188px;
    background:var(--skin);
    z-index:2;
}

.waist::before{
    content:"";
    position:absolute;
    width:38px;
    height:13px;
    left:3px;
    bottom:-2px;
    border-bottom:3px solid rgba(126,55,35,.34);
    border-radius:50%;
}

.waist::after{
    content:"";
    position:absolute;
    width:10px;
    height:10px;
    left:17px;
    top:20px;
    border-radius:50%;
    background:#dca83c;
}

.skirt{
    position:absolute;
    width:188px;
    height:278px;
    left:41px;
    top:218px;
    border-radius:48% 48% 43% 43% / 8% 8% 92% 92%;
    background:
        radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.24), transparent 52%),
        radial-gradient(circle, rgba(70,11,17,.74) 0 3px, transparent 3.5px),
        linear-gradient(90deg, rgba(141,29,31,.95), #d13f35 45%, #aa2c2c);
    background-size:auto, 23px 22px, auto;
    border-bottom:8px solid #dfb63e;
    z-index:2;
    box-shadow:inset 0 -18px 0 rgba(0,0,0,.1);
    transform-origin:50% 0;
    animation:skirtSway 1.05s ease-in-out infinite;
}

.skirt::after{
    content:"";
    position:absolute;
    left:50%;
    top:10px;
    bottom:8px;
    border-left:2px dashed rgba(86,16,18,.48);
}

.belt{
    position:absolute;
    width:116px;
    height:20px;
    left:77px;
    top:213px;
    z-index:4;
    border-radius:50%;
    background:linear-gradient(90deg, #cf982d, #ffe36e 45%, #bb7d1e);
    box-shadow:0 5px 0 rgba(84,17,16,.38);
}

.belt::before,
.belt::after{
    content:"";
    position:absolute;
    top:14px;
    width:10px;
    height:18px;
    border-radius:0 0 8px 8px;
    background:#e7bd3c;
    box-shadow:
        18px 2px 0 #c9912a,
        36px -1px 0 #e7bd3c,
        54px 2px 0 #c9912a,
        72px -1px 0 #e7bd3c;
}

.belt::before{
    left:10px;
}

.belt::after{
    display:none;
}

.arm{
    position:absolute;
    width:98px;
    height:17px;
    top:122px;
    background:var(--skin);
    border-radius:20px;
    transform-origin:right center;
    z-index:2;
}

.arm::after{
    content:"";
    position:absolute;
    width:24px;
    height:24px;
    top:-4px;
    border-radius:50%;
    background:#efb28b;
}

.arm::before{
    content:"";
    position:absolute;
    width:16px;
    height:16px;
    top:0;
    border:3px solid #d4ad3e;
    border-radius:50%;
}

.arm.left{
    left:27px;
    transform:rotate(-58deg);
}

.arm.right{
    right:27px;
    transform:rotate(58deg);
    transform-origin:left center;
}

.arm.left::after{
    left:-10px;
}

.arm.right::after{
    right:-10px;
}

.arm.left::before{
    left:54px;
}

.arm.right::before{
    right:54px;
}

.caption{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    color:#d8b775;
    font-size:clamp(.72rem, 2.7vw, .95rem);
    letter-spacing:10px;
    text-transform:uppercase;
}

.caption::before,
.caption::after{
    content:"\2726";
    color:#d7a642;
    letter-spacing:0;
}

.touch-button strong{
    display:block;
    margin-top:4px;
    font-family:"Brush Script MT", "Segoe Script", cursive;
    font-size:clamp(3rem, 11vw, 5rem);
    font-weight:400;
    line-height:.95;
    color:#ffeeb7;
    text-shadow:0 0 24px rgba(213,166,82,.35);
}

.touch-button span{
    display:block;
    margin-top:18px;
    font-size:clamp(.8rem, 3vw, 1rem);
    letter-spacing:9px;
    text-transform:uppercase;
    color:rgba(241,215,199,.55);
}

@keyframes pulse{
    0%,100%{
        transform:translateY(0) scale(1);
        opacity:.8;
    }
    50%{
        transform:translateY(-4px) scale(1.12);
        opacity:1;
    }
}

@keyframes float{
    0%,100%{
        transform:translateY(0) scale(var(--dancer-scale));
    }
    50%{
        transform:translateY(-12px) scale(var(--dancer-scale));
    }
}

@keyframes bellyShimmy{
    0%,100%{
        transform:translateX(0) rotate(0deg) skewX(0deg);
    }
    20%{
        transform:translateX(-9px) rotate(-4deg) skewX(-3deg);
    }
    40%{
        transform:translateX(8px) rotate(4deg) skewX(3deg);
    }
    62%{
        transform:translateX(-6px) rotate(-3deg) skewX(-2deg);
    }
    82%{
        transform:translateX(6px) rotate(3deg) skewX(2deg);
    }
}

@keyframes skirtSway{
    0%,100%{
        transform:skewX(0deg) scaleX(1);
        background-position:0 0, 0 0, 0 0;
    }
    25%{
        transform:skewX(4deg) scaleX(1.03);
        background-position:0 0, 5px 0, 0 0;
    }
    50%{
        transform:skewX(-4deg) scaleX(.98);
        background-position:0 0, -5px 0, 0 0;
    }
    75%{
        transform:skewX(3deg) scaleX(1.02);
        background-position:0 0, 4px 0, 0 0;
    }
}

@keyframes goldConfetti{
    0%{
        opacity:1;
        transform:
            translate(-50%, -50%)
            rotate(0deg)
            scale(.65);
    }
    35%{
        opacity:1;
        transform:
            translate(calc(-50% + (var(--spark-x) * .45)), calc(-50% + (var(--spark-y) * .3)))
            rotate(var(--spark-spin))
            scale(1);
    }
    100%{
        opacity:0;
        transform:
            translate(calc(-50% + var(--spark-x)), calc(-50% + var(--spark-y)))
            rotate(calc(var(--spark-spin) * 2))
            scale(.72);
    }
}

@media(max-height:720px){
    .cartoon{
        --dancer-scale:.86;
        height:430px;
        margin-bottom:-50px;
    }

    .touch-button{
        padding-top:0;
    }
}

@media(max-width:430px){
    .loading-page{
        padding:20px 18px 82px;
    }

    .loading-content{
        transform:translateY(5vh);
    }

    .loading-content p{
        letter-spacing:4px;
    }

    .touch-page{
        padding:16px 16px 54px;
    }

    .cartoon{
        --dancer-scale:.78;
        height:390px;
        margin-bottom:-74px;
    }

    .caption{
        gap:12px;
        font-size:.7rem;
        letter-spacing:5px;
    }

    .touch-button strong{
        font-size:clamp(3rem, 16vw, 4.3rem);
    }

    .touch-button span{
        margin-top:14px;
        font-size:.76rem;
        letter-spacing:5px;
        line-height:1.5;
    }
}

</style>
</head>
<body>

<section class="loading-page" id="loadingPage" aria-label="Loading invitation">
    <div class="loading-content">
        <h1>Menna</h1>
        <p>Bachelorette Night &#128293;</p>
        <div class="loading-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</section>

<section class="touch-page" aria-label="Open invitation">
    <div class="stage-border" aria-hidden="true"></div>
    <div class="stars" aria-hidden="true"></div>
    <div class="spark-layer" id="sparkLayer" aria-hidden="true"></div>
    <button class="touch-button" id="openInvitation" type="button">
        <div class="cartoon" aria-hidden="true">
            <div class="veil"></div>
            <div class="hair"></div>
            <div class="face"></div>
            <div class="neck"></div>
            <div class="headpiece"></div>
            <div class="earring left"></div>
            <div class="earring right"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="smile"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="top"></div>
            <div class="lower-body">
                <div class="waist"></div>
                <div class="belt"></div>
                <div class="skirt"></div>
            </div>
        </div>
        <div class="caption">Last Night Of Freedom</div>
        <strong>Touch Me</strong>
        <span>to open your invitation</span>
    </button>
</section>

<script>

const loadingPage = document.getElementById("loadingPage");
const openInvitation = document.getElementById("openInvitation");
const sparkLayer = document.getElementById("sparkLayer");
let isOpening = false;

window.addEventListener("load", () => {
    setTimeout(() => {
        loadingPage.classList.add("is-hidden");
    }, 1800);
});

function createSparkBurst(){
    const sparks = 70;

    for(let i = 0; i < sparks; i++){
        const spark = document.createElement("span");
        const startX = 32 + Math.random() * 36;
        const x = (Math.random() - .5) * 260;
        const y = 80 + Math.random() * 430;
        const size = 5 + Math.random() * 8;
        const spin = 180 + Math.random() * 620;

        spark.className = "spark";
        spark.style.left = `${startX}%`;
        spark.style.width = `${size}px`;
        spark.style.height = `${size}px`;
        spark.style.setProperty("--spark-x", `${x}px`);
        spark.style.setProperty("--spark-y", `${y}px`);
        spark.style.setProperty("--spark-spin", `${spin}deg`);
        spark.style.animationDelay = `${Math.random() * .22}s`;
        spark.style.animationDuration = `${1.25 + Math.random() * .85}s`;
        sparkLayer.appendChild(spark);

        spark.addEventListener("animationend", () => spark.remove());
    }
}

openInvitation.addEventListener("click", () => {
    if(isOpening){
        return;
    }

    isOpening = true;
    createSparkBurst();

    setTimeout(() => {
        window.location.href = "invitation.html";
    }, 850);
});

</script>

</body>
</html>
